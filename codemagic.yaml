workflows:
  ios-xean-app:
    # "Xean" — the manager + maintenance-staff app (bundle ID
    # ca.xean.manager, the original App Store Connect entry, just renamed).
    # Opens to /app-picker (see frontend/capacitor.config.ts) so one app can
    # serve both roles. Not to be confused with ios-tenant-app below, the
    # separate tenant-facing app under its own bundle ID.
    name: Xean - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: frontend

    # No `triggering:` block on purpose — this repo also hosts the backend
    # and two other frontend portals, which change constantly. Without an
    # explicit trigger, Codemagic only runs this workflow when started by
    # hand (UI or API), so an unrelated backend commit never burns a paid
    # iOS build.

    integrations:
      # Set this up once in Codemagic's UI: Team settings > Integrations >
      # App Store Connect > add key, using:
      #   Key ID:      3LVHXR893J
      #   Issuer ID:   23d670a4-311f-431e-8c72-8783d3be1ab7
      #   .p8 file:    (upload it directly — Codemagic stores it encrypted)
      # Name the integration exactly "xean_manager_appstore" (or update the
      # reference below to match whatever name you actually give it). The
      # key itself is never pasted into this file or committed anywhere —
      # Codemagic injects it into the build environment at run time.
      app_store_connect: xean_manager_appstore

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ca.xean.manager
      # CERTIFICATE_PRIVATE_KEY lives in this group (Codemagic UI > Team
      # settings > Environment variable groups), not here — automatic code
      # signing needs a private key supplied up front to pair with the
      # certificate fetch-signing-files creates; without it the create step
      # fails with "Cannot save Signing Certificates without certificate
      # private key" (confirmed against Codemagic's own docs and prior
      # reports of this exact error — CODEMAGIC_API_TOKEN was the original
      # suspicion but isn't what this error is actually about). Shared with
      # ios-tenant-app below rather than duplicated: an Apple Developer
      # account can only hold 3 active "iOS Distribution" certificates at
      # once, and both apps sign under the same team, so both workflows are
      # meant to reuse the one certificate this key creates.
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: ca.xean.manager
        # App Store Connect's own numeric "Apple ID" for this app (General
        # > App Information > Apple ID there) -- NOT the bundle identifier.
        # get-latest-testflight-build-number below takes this, not
        # BUNDLE_ID, despite both looking like plausible "which app" values;
        # passing the bundle identifier here is exactly what silently broke
        # the build-number increment (see that step's own comment). Confirmed
        # against this app's real App Store Connect record via the API
        # directly, not guessed.
        APP_STORE_APPLE_ID: "6810459135"
        # Not a workspace: this Capacitor project uses Swift Package
        # Manager for its native dependencies (see ios/App/CapApp-SPM), not
        # CocoaPods -- there's no Podfile anywhere in ios/App, which is also
        # why the "Install CocoaPods dependencies" step was removed from
        # this workflow already. A CocoaPods-managed project gets its
        # App.xcworkspace from `pod install`; without CocoaPods that file
        # never exists, only the .xcodeproj's own internal workspace does
        # (ios/App/App.xcodeproj/project.xcworkspace, not meant to be built
        # directly). xcode-project build-ipa's --project flag is the
        # documented way to build a plain .xcodeproj with no wrapping
        # workspace.
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 24
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Set up keychain to be used for code signing
        # Has to run before fetch-signing-files below, not after — this
        # creates and activates the keychain that `keychain add-certificates`
        # later imports the fetched certificate + private key into. Without
        # this running first, the later "Set up signing certificate" step
        # had nothing to import into (see that step's own comment for what
        # actually broke and how this was found).
        script: keychain initialize

      - name: Fetch signing files
        # environment.ios_signing above is just metadata — it doesn't fetch
        # or create anything by itself. This is the step that actually asks
        # Apple (via the app_store_connect integration) for a distribution
        # certificate + provisioning profile matching ca.xean.manager,
        # creating them on the first run if none exist yet. Skipping this
        # is exactly what produced "No matching profiles found" — nothing
        # had ever put a profile on the build machine for use-profiles to
        # find.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up signing certificate
        # This used to run `keychain initialize` here too — a copy-paste
        # leftover that never actually imported anything, since initialize
        # just creates/activates an empty keychain (moved to its own step
        # above, before fetch-signing-files, which is where it actually
        # belongs). fetch-signing-files above saves the certificate + private
        # key to disk but does not itself put them in the keychain; this is
        # the step that does that, which is what xcodebuild archive actually
        # reads from at sign time. Its absence here is exactly why archive
        # failed with "No signing certificate 'iOS Distribution' found ...
        # with a private key" even though fetch-signing-files and
        # use-profiles both reported success — the profile was wired up
        # correctly, but the keychain xcodebuild checks for a matching
        # certificate + key was still empty.
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        # Now that the certificate + profile fetched above actually exist
        # on disk, this just wires them into the Xcode project's build
        # settings. No manual cert/profile management, no secrets checked
        # into the repo.
        script: xcode-project use-profiles

      - name: Increment build number
        # App Store Connect rejects a re-upload with a build number it's
        # already seen, which a from-scratch checkout's CURRENT_PROJECT_VERSION
        # (always 1, see Info.plist) would trip on every build after the
        # first. Reading the last TestFlight build number and incrementing
        # keeps every upload valid without hand-tracking a counter.
        #
        # This used to pass "$BUNDLE_ID" here instead of the app's numeric
        # Apple ID -- get-latest-testflight-build-number silently failed on
        # that (wrong argument type; confirmed against Codemagic's own docs,
        # which show only the numeric Apple ID ever used here), leaving
        # LATEST_BUILD_NUMBER empty. Bash's arithmetic treats an empty
        # variable as 0, so $(($LATEST_BUILD_NUMBER + 1)) silently evaluated
        # to 1 every time instead of erroring -- setting the build back to 1
        # and reproducing "must be higher than the previously uploaded
        # version" at Apple's publish step instead of failing here, where
        # it would've been obvious immediately. The explicit check below is
        # what actually catches that class of failure now, rather than a
        # coincidence of the first-ever build already starting at 1 masking
        # it (see APP_STORE_APPLE_ID's own comment for the argument fix).
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            echo "error: could not determine the latest TestFlight build number -- refusing to guess" >&2
            exit 1
          fi
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Not submit_to_app_store — that starts an actual App Store review
        # submission, which needs review metadata (description, screenshots,
        # etc.) prepared in App Store Connect first. TestFlight is the right
        # first target: it puts a real, installable build in front of real
        # testers without committing to a public release.

  ios-tenant-app:
    # "Xean Resident" — the tenant-facing app, a completely separate
    # Capacitor project (frontend/mobile-tenant) under its own bundle ID
    # (ca.xean.tenant) and its own App Store Connect app entry. Opens
    # straight to the tenant portal — one audience, no picker needed (see
    # ios-xean-app above for the app that does need one).
    name: Xean Resident - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: frontend/mobile-tenant

    # No `triggering:` block, same reasoning as ios-xean-app: manual-only,
    # so this repo's constant backend/other-portal commits never burn a
    # paid build on this workflow either.

    integrations:
      # Reuses the same integration as ios-xean-app on purpose: the App
      # Store Connect API key behind "xean_manager_appstore" already showed
      # team-wide bundle-ID visibility (not scoped to ca.xean.manager alone)
      # when it was checked while registering ca.xean.tenant, so it's very
      # likely already authorized for this app too. If the very first build
      # here fails on the signing step with a permissions error, that key
      # was scoped narrower than it looked — add a second App Store Connect
      # integration in Codemagic (same Key ID/Issuer ID/.p8, new name) and
      # point this line at it instead.
      app_store_connect: xean_manager_appstore

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ca.xean.tenant
      # Same ios_signing group as ios-xean-app above, on purpose — see that
      # workflow's own comment for why CERTIFICATE_PRIVATE_KEY is shared
      # rather than duplicated per app.
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: ca.xean.tenant
        # This app's own numeric App Store Connect Apple ID -- see
        # ios-xean-app's own APP_STORE_APPLE_ID comment for why this,
        # specifically, and not BUNDLE_ID, is what get-latest-testflight-
        # build-number needs. Confirmed against this app's real App Store
        # Connect record via the API directly, not guessed.
        APP_STORE_APPLE_ID: "6810476965"
        # Same as ios-xean-app above: no CocoaPods/Podfile here either (this
        # project also uses Swift Package Manager, see ios/App/CapApp-SPM),
        # so there's no App.xcworkspace to build against -- just the
        # .xcodeproj directly.
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 24
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Sync Capacitor iOS project
        # No separate "build web assets" step — unlike ios-xean-app, this
        # project's webDir (./www) is a static placeholder, never actually
        # shown (server.url takes the WebView straight to the live site).
        # There's nothing to build.
        script: npx cap sync ios

      - name: Set up keychain to be used for code signing
        # Same fix as ios-xean-app above: has to run before fetch-signing-
        # files, not after -- see that workflow's own comments for the full
        # story (this ordering bug was the actual cause of "No signing
        # certificate 'iOS Distribution' found ... with a private key" at
        # the archive step, on this app too).
        script: keychain initialize

      - name: Fetch signing files
        # Same gap as ios-xean-app had: environment.ios_signing is metadata
        # only, it doesn't fetch or create anything. This step actually
        # gets (or creates, first run) a distribution cert + provisioning
        # profile for ca.xean.tenant via the app_store_connect integration.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up signing certificate
        # Actually imports the fetched certificate + private key into the
        # keychain set up above -- `keychain initialize` (what used to run
        # here) only creates an empty keychain, it doesn't import anything.
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Increment build number
        # Same fix as ios-xean-app above: this needs APP_STORE_APPLE_ID (the
        # numeric Apple ID), not BUNDLE_ID -- see that workflow's own
        # comment for the full story on how passing the bundle identifier
        # here silently produced build number 1 every time instead of
        # incrementing.
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            echo "error: could not determine the latest TestFlight build number -- refusing to guess" >&2
            exit 1
          fi
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
