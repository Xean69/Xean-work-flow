    <title>Xean</title>

    <!-- The manager dashboard and tenant portal are two different install
         targets (different start_url/scope so an installed icon returns to
         the right app) sharing one SPA build — this picks the right static
         manifest before the browser evaluates installability. Must run
         synchronously, before body parsing, not from a React effect. -->
    <link rel="manifest" id="app-manifest" href="/manifest-app.webmanifest" />
    <script>
      if (location.pathname.startsWith('/portal')) {
        document.getElementById('app-manifest').href = '/manifest-portal.webmanifest'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
